name: Docs
on:
  pull_request:
    paths:
      # The site, and everything it is generated from: package sources and
      # typedoc.json (API reference), package.json (version labels), and
      # CHANGELOG.md (release notes).
      - 'docs/**'
      - 'core/**'
      - 'frameworks/*/uirouter-*/**'
      - 'plugins/*/package.json'
      - 'tools/packages.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    # Same paths as pull_request.
    paths:
      - 'docs/**'
      - 'core/**'
      - 'frameworks/*/uirouter-*/**'
      - 'plugins/*/package.json'
      - 'tools/packages.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One run per branch or PR; never cancel a deployment in progress.
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: '1'
  HUSKY: '0'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Deployments (manual runs) use the GitHub Pages path of this repository
      # unless a variable overrides it. Other builds are served locally from "/".
      DOCS_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && (vars.DOCS_BASE_URL || '/ui-router/') || '/' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: "npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund"
      - run: "npm ci --ignore-scripts --no-audit --no-fund"
      # Fails on broken links, MDX errors, and missing required front matter.
      - run: "npm run build --workspace docs"
      # A build can pass with inconsistent output; check the result itself.
      - run: "npm run verify:build --workspace docs"
      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-preview
          path: docs/build
          if-no-files-found: error
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build
      - name: Summary
        env:
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "## Docs build"
            echo "Built and checked $(find docs/build -name '*.html' | wc -l) pages (base URL \`$DOCS_BASE_URL\`)."
            if [ "$EVENT" = "pull_request" ]; then
              echo
              echo "Preview: download the **docs-preview** artifact from this run, unzip it, and"
              echo "serve the folder, for example \`npx serve docs-preview\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  deploy:
    # Deploys only when a maintainer runs this workflow manually on main, after
    # the changes to publish (a release, or docs fixes) are merged. Pull
    # requests and pushes to main only build and check the site.
    # Off until a maintainer enables GitHub Pages (Source: GitHub Actions) and
    # sets the repository variable DOCS_DEPLOY_ENABLED to "true".
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
